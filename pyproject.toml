[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "ado-trace-foundry"
version = "0.1.0"
description = "Read-only Azure DevOps traceability and RAG-ready knowledge export toolkit"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "ADOTraceFoundry contributors"}]
dependencies = []
[project.optional-dependencies]
documents = ["pypdf>=5,<8", "python-docx>=1.1,<2", "python-pptx>=1,<2", "openpyxl>=3.1,<4"]
ocr = ["pytesseract>=0.3.13,<1", "Pillow>=11,<13"]
[project.scripts]
adotracefoundry = "adotracefoundry.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
